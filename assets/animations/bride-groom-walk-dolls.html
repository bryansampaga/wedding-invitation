<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bride and groom walking</title>
<style>
:root{
  --pg1:#f1f4ee;--pg2:#e4e9df;--line:rgba(120,135,115,.28);--shadow:rgba(60,75,55,.22);
  --sky1:#fbf9f1;--sky2:#e3ecdc;--h1:#d3e0cc;--h2:#bcd0b5;--tree:#a9bda3;--bush:#8fa889;--path:#f0e6d3;--dash:#d6c298;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg1:#161c18;--pg2:#101512;--line:rgba(190,205,185,.2);--shadow:rgba(0,0,0,.5);--sky1:#2a3630;--sky2:#141b17;--h1:#2c3d33;--h2:#233228;--tree:#35503d;--bush:#42614a;--path:#40392b;--dash:#6b5d3d;color-scheme:dark}}
:root[data-theme="dark"]{--pg1:#161c18;--pg2:#101512;--line:rgba(190,205,185,.2);--shadow:rgba(0,0,0,.5);--sky1:#2a3630;--sky2:#141b17;--h1:#2c3d33;--h2:#233228;--tree:#35503d;--bush:#42614a;--path:#40392b;--dash:#6b5d3d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:0;background:linear-gradient(160deg,var(--pg1),var(--pg2));background-color:var(--pg1)}
.card{width:100%;height:100vh;overflow:hidden;border:0;border-radius:0;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));box-shadow:none}
svg{display:block;width:100%;height:100%;animation:appear 1.2s ease both}
@keyframes appear{from{opacity:0}}
.hill1{fill:var(--h1)}.hill2{fill:var(--h2)}.tree{fill:var(--tree)}.tree2{fill:color-mix(in srgb,var(--tree) 68%,#fff)}.bush2{fill:color-mix(in srgb,var(--bush) 66%,#fff)}.bush3{fill:color-mix(in srgb,var(--bush) 78%,#000)}.bush{fill:var(--bush)}.road{fill:var(--path)}
.dash{stroke:var(--dash);stroke-width:1.6;stroke-dasharray:10 14;animation:dash .77s linear infinite}
@keyframes dash{to{stroke-dashoffset:24}}
.far{animation:scroll 46s linear infinite}.mid{animation:scroll 14s linear infinite}
@keyframes scroll{to{transform:translateX(-440px)}}
.dv path,.dv ellipse,.dv circle{fill:#fff;stroke:#b3bacb;stroke-width:.5}.dv .bk{fill:#e0a458;stroke:none}.dv .sh{fill:#e7eaf3;stroke:none}.dv .wb{fill:#e3e7f1}.dv .ln{fill:none;stroke:#c3c9d8;stroke-width:.35}.dv .nos{stroke:none}.dv .eye{fill:#2b2230;stroke:none}
.wing.fl{animation:flap .42s ease-in-out infinite alternate;transform-origin:0px -3px}.wing.fl.wb{animation-delay:-.08s}
@keyframes flap{from{transform:rotate(-38deg)}to{transform:rotate(30deg)}}
.fly{animation:fly linear infinite both}.bob2{animation:bob2 1.5s ease-in-out infinite alternate}
@keyframes fly{from{transform:translateX(-30px)}to{transform:translateX(470px)}}
@keyframes bob2{to{transform:translateY(-5px)}}
.tk,.pch,.flg{animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
.tk{animation-name:tk}.pch{animation-name:pch}.flg{animation-name:flg}
@keyframes tk{0%{transform:translate(470px,117px)}30%{transform:translate(330px,117px)}38%{transform:translate(342px,98px)}100%{transform:translate(545px,-12px)}}
@keyframes pch{0%,30%{opacity:1}30.1%,100%{opacity:0}}
@keyframes flg{0%,30%{opacity:0}30.1%,100%{opacity:1}}
.bob{animation:bob .4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1.3px)}}
.leg{transform-origin:0 0;animation:swing .8s ease-in-out infinite alternate}.leg.b{animation-direction:alternate-reverse}
@keyframes swing{0%{transform:rotate(-24deg)}50%{transform:rotate(0) translateY(-1.5px)}100%{transform:rotate(24deg)}}
.arm{transform-origin:0 0;animation:armsw .8s ease-in-out infinite alternate}
@keyframes armsw{from{transform:rotate(13deg)}to{transform:rotate(-13deg)}}
.foot{animation:step .8s ease-in-out infinite alternate}.foot.b{animation-direction:alternate-reverse}
@keyframes step{0%{transform:translateX(-5px)}50%{transform:translate(0,-1.4px)}100%{transform:translateX(5px)}}
.sway{transform-origin:0 56px;animation:sway .8s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.train{transform-origin:-14px 100px;animation:train 1.1s ease-in-out infinite alternate}
@keyframes train{from{transform:skewX(-4deg) scaleX(1)}to{transform:skewX(3deg) scaleX(.9)}}
.veil{transform-origin:-2px 30px;animation:flutter 1.3s ease-in-out infinite alternate}
@keyframes flutter{from{transform:rotate(-5deg) scaleX(1)}to{transform:rotate(4deg) scaleX(.88)}}
.bq{transform-origin:16px 66px;animation:bq .8s ease-in-out infinite alternate}
@keyframes bq{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.pt{animation:drift linear infinite both}
@keyframes drift{0%{transform:translate(0,-8px) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translate(-80px,135px) rotate(400deg);opacity:0}}
.sp{animation:tw 2.6s ease-in-out infinite both;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:.95}}
.hair{transform-origin:-2px 29px;animation:hairsw 1.2s ease-in-out infinite alternate .1s}
@keyframes hairsw{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bq{transform-origin:16px 70px}
.arm2{transform-origin:0 0;animation:armsw2 .8s ease-in-out infinite alternate}
@keyframes armsw2{from{transform:rotate(9deg)}to{transform:rotate(-9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
